[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "lerobot_robot_bimanual"
version = "0.1.0"
description = "Models, tasks, and data for a low-cost fixed-base bimanual robot"
requires-python = ">=3.12"
dependencies = [
    "lerobot[core_scripts,feetech,training]==0.6.1",
    "mujoco>=3.3,<4",
    "numpy>=2.0,<2.3",
]

[project.optional-dependencies]
pi05 = ["lerobot[pi]==0.6.1"]
remote = ["lerobot[async]==0.6.1"]
dev = ["pytest>=8,<10", "ruff>=0.11,<1"]

[project.scripts]
bimanual-view = "simulation.view:main"
bimanual-tasks = "simulation.tasks:main"
bimanual-task-demo = "simulation.tasks.demo:main"
bimanual-physical-record = "bimanual_robot.recording.physical_teleop:main"
bimanual-calibrate = "hardware.calibrate_feetech:main"
bimanual-leader-calibrate = "hardware.calibrate_feetech_positions:main"
bimanual-follower-calibrate = "hardware.calibrate_feetech_follower:main"
bimanual-follow = "hardware.teleoperate_feetech:main"
bimanual-camera = "hardware.read_usb_camera:main"
bimanual-policies = "bimanual_robot.policies.catalog:main"
bimanual-train = "bimanual_robot.training.train:main"
bimanual-evaluate = "bimanual_robot.evaluation.rollout:main"
bimanual-eval-loss = "bimanual_robot.evaluation.offline_loss:main"
bimanual-physical-rollout = "bimanual_robot.evaluation.physical_rollout:main"

[tool.setuptools]
py-modules = ["lerobot_robot_bimanual"]
packages = [
    "bimanual_robot",
    "bimanual_robot.datasets",
    "bimanual_robot.evaluation",
    "bimanual_robot.policies",
    "bimanual_robot.recording",
    "bimanual_robot.training",
    "hardware",
    "simulation",
    "simulation.backends",
    "simulation.backends.mujoco",
    "simulation.tasks",
    "simulation.tasks.task_01_basic_object_placement",
    "simulation.tasks.task_02_object_retrieval",
    "simulation.tasks.task_03_color_conditioned_sorting",
    "simulation.tasks.task_04_drawer_opening",
    "simulation.tasks.task_05_cube_stacking",
    "simulation.tasks.task_06_bimanual_handover",
    "simulation.tasks.task_07_warehouse_stocking",
]

[tool.setuptools.package-data]
"simulation.backends.mujoco" = ["assets/*.xml", "assets/meshes/*.stl"]
"simulation.tasks" = ["task_*/README.md", "task_*/scene.xml"]

[tool.pytest.ini_options]
addopts = "-ra -p no:capture"
testpaths = ["tests"]
markers = [
    "integration: end-to-end integration tests",
    "slow: tests that run complete simulated episodes",
]

[tool.ruff]
extend-exclude = ["doc", "hardware"]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM", "RUF"]
